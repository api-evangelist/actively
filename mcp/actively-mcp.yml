- ChatGPT
- Claude
- Cowork
capabilities:
- per-account research
- account strategy
- persistent memory / reasoning loops
- context enrichment for customer-facing agents

deployment:
  mode: remote
  endpoint: https://api.actively.ai/mcp
  auth: oauth
  verified: probed
  checked: '2026-08-13'
  source: >-
    POST https://api.actively.ai/mcp returned HTTP 401 with a spec-compliant
    WWW-Authenticate challenge, and the resource metadata it names resolves
    anonymously to resource "https://api.actively.ai/mcp", resource_name
    "Actively Intelligence MCP".
  install: null
  package: null
  note: >-
    Remote only. Actively publishes no stdio/npx package — there is nothing to
    install. The endpoint is callable by any MCP client that can complete the
    OAuth flow, which makes this a genuine agent surface rather than a
    developer-machine integration.

endpoint: https://api.actively.ai/mcp
transport: streamable-http
authentication:
  type: oauth2
  flow: authorization_code
  pkce: S256
  bearer_methods_supported:
  - header
  authorization_server: https://auth.actively.ai
  dynamic_client_registration: https://auth.actively.ai/oauth2/register
  authorization_endpoint: https://auth.actively.ai/oauth2/authorize
  token_endpoint: https://auth.actively.ai/oauth2/token
  device_authorization_endpoint: https://auth.actively.ai/oauth2/device_authorization
  scopes_supported:
  - openid
  - profile
  - email
  - offline_access
  note: >-
    Client credentials are not required up front — the authorization server
    supports RFC 7591 dynamic client registration and
    token_endpoint_auth_methods_supported ["none"], the public-client profile
    MCP clients use. A human Actively login is still required to consent, so
    the server is reachable but not anonymously usable.

