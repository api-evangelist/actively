tools_note: >-
  NOT DERIVED AND NOT GUESSED. POST {"jsonrpc":"2.0","id":1,"method":"tools/list"}
  with Accept: application/json, text/event-stream returns HTTP 401
  {"error":"invalid_token","error_description":"Authentication required"} — the
  live tool list and per-tool inputSchema require an authenticated
