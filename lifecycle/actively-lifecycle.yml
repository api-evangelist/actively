findings:
- >-
  Actively ships a live, OAuth-protected, spec-clean MCP server but publishes
  none of the operational contract around it — no status page, no changelog,
  no deprecation policy, no SLA. An integrator has no way to be told when the
  server breaks or changes.
- >-
  The gap is asymmetric and worth flagging to the provider: the hard part
  (a correct MCP authorization chain) is already done to spec. The missing
  pieces are cheap, static pages.
