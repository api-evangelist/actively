findings:
- >-
  An agent connecting to Actively's MCP server has no way to learn its budget
  before it is enforced, and no runtime signal to back off against. For a
  product whose premise is autonomous per-account agents running "24/7", the
  absence of a rate-limit contract is a material agent-readiness gap.
- >-
  Adding IETF draft `RateLimit` / `RateLimit-Policy` headers (or the X-
  variants) to MCP responses would be the highest-value single change here,
  because it is the only limit signal an autonomous client can act on.
