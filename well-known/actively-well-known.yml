findings:
- >-
  Actively publishes no security.txt on any host, despite operating a written
  responsible-disclosure policy at www.actively.ai/responsible-disclosure with
  a security@actively.ai contact. Publishing RFC 9116 security.txt would make
  that policy machine-discoverable at zero cost.
- >-
  No /.well-known/api-catalog and no ai-plugin.json on any host.
- >-
  No A2A agent card at either the current (/.well-known/agent-card.json) or
  legacy (/.well-known/agent.json) path on any of the four hosts.
- >-
  The discovery chain is complete and correct for MCP: WWW-Authenticate on the
  401 names resource_metadata, the protected-resource document names the
  authorization server, and the authorization server publishes registration
  and PKCE support. An MCP client can complete the whole handshake from an
  anonymous start.
