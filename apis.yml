apis:
- name: Actively Intelligence MCP
  description: >-
    Actively's hosted (remote) Model Context Protocol server, which connects its
    Per-Account Agents — per-account research, strategy and persistent memory —
    into external AI clients such as ChatGPT, Claude and Cowork. The endpoint is
    live and its address is anonymously discoverable via RFC 9728
    protected-resource metadata, but calling it requires OAuth 2.1
    (authorization code + PKCE) against https://auth.actively.ai and therefore
    an Actively customer account. The tool list is auth-gated and is not
    published anywhere, so no tool inventory is recorded.
  humanURL: https://www.actively.ai/products/mcp-server
  baseURL: https://api.actively.ai/mcp
  tags:
  - MCP
  - AI Agents
  - Revenue Intelligence
  properties:
  - type: MCPServer
    url: mcp/actively-mcp.yml
