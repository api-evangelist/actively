aid: actively
name: Actively
description: >-
  Actively AI delivers "Intelligence-Led Revenue" — an AI revenue-intelligence
  platform whose Per-Account Agents work every prospect and customer account
  24/7, surfacing next-best-actions and helping go-to-market teams execute them
  across the full lifecycle. The product spans an Agent Inbox, an Assistant,
  Watchtower, an API for embedding GTM intelligence into internal tools and
  workflows, and a hosted MCP server that connects its per-account agents into
  ChatGPT, Claude, and Cowork. Actively is backed by Bain Capital Ventures.
