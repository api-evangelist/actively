findings:
- >-
  NO SDKs AT ALL. Actively's only published programmable surface is the hosted
  MCP server at https://api.actively.ai/mcp, which is consumed by MCP clients
  over OAuth rather than by a vendor SDK — so the absence is partly by design.
- >-
  However the company also markets an "API Platform" product
  (www.actively.ai/products/api-platform) promising "direct access to
  per-account agent memory, decisions, and strategy" for embedding into "CRM
  views, Slack alerts, dashboards, or custom applications". That product has no
  SDK, no OpenAPI, no documented base URL and no public reference — a customer
  cannot begin an integration without a sales conversation.
- >-
  No MCP stdio package either. There is no npx/pip installable Actively MCP
  server; the server is remote-only.
- >-
  Because no package exists, there is no release cadence to read and therefore
  no SDK-decay signal available for this provider — version and published
  fields are null throughout, which reflects absence rather than staleness.
no_pointer_note: >-
